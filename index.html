<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VENEVO MÚSICA - Radio En Vivo</title>
    <!-- Fuentes e Iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient-start: #E61673;
            --bg-gradient-end: #3A0947;
            --text-color: #FFFFFF;
            --accent-color: #FFD700;
            --card-bg: rgba(255, 255, 255, 0.1);
            --font-family: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* --- CABECERA --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            width: 100%;
            background: rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(5px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-icon {
            font-size: 1.4rem;
            cursor: pointer;
        }

        .brand-title {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        .station-logo-small {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cargando-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .stats-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            opacity: 0.85;
        }

        .mode-switch {
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 2px;
            display: flex;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .mode-btn {
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background-color: #fff;
            color: var(--bg-gradient-end);
        }

        /* --- CONTENIDO CENTRAL --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .player-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            gap: 40px;
            margin-bottom: 30px;
        }

        /* Tarjetas Laterales */
        .side-card {
            width: 160px;
            height: 140px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0.5;
            transition: opacity 0.3s;
            cursor: pointer;
            padding: 10px;
        }

        .side-card:hover { opacity: 0.8; }
        .side-card h3 { font-size: 1.3rem; margin-bottom: 4px; font-weight: 700; }
        .side-card p { font-size: 0.6rem; opacity: 0.8; letter-spacing: 0.5px; }

        /* Dial Principal */
        .radio-dial-container {
            position: relative;
            width: 260px;
            height: 260px;
            flex-shrink: 0;
        }

        .dial-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, var(--accent-color) 0deg, var(--accent-color) 25deg, rgba(255,255,255,0.08) 25deg, rgba(255,255,255,0.08) 360deg);
            border-radius: 50%;
            mask: radial-gradient(transparent 58%, black 60%);
            -webkit-mask: radial-gradient(transparent 58%, black 60%);
            animation: rotateDial 15s linear infinite;
        }
        
        @keyframes rotateDial {
            100% { transform: rotate(360deg); }
        }

        .dial-center {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            background-color: #120418;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .station-logo-large {
            width: 85px;
            height: auto;
            margin-bottom: 8px;
            object-fit: contain;
        }

        .dial-spectrum {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            height: 20px;
            width: 70%;
        }
        
        .spectrum-bar {
            width: 2.5px;
            background: var(--accent-color);
            animation: pulseSpectrum 0.6s infinite alternate;
            border-radius: 2px;
        }
        
        @keyframes pulseSpectrum {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        /* Flechas de navegación del dial */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .nav-arrow:hover { background: rgba(0,0,0,0.6); }
        .nav-arrow.prev { left: 10px; }
        .nav-arrow.next { right: 10px; }

        /* --- CONTROLES DE REPRODUCCIÓN --- */
        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            width: 100%;
        }

        .control-icon {
            font-size: 1.1rem;
            opacity: 0.8;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .control-icon:hover { opacity: 1; }

        .play-btn {
            width: 65px;
            height: 65px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .play-btn:active { transform: scale(0.95); }

        .play-icon {
            font-size: 1.5rem;
            color: var(--bg-gradient-start);
            margin-left: 3px;
        }

        /* --- BARRA INFERIOR DE ESTACIÓN ACTUAL --- */
        .current-station-bar {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .station-logo-tiny {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .station-info-text {
            flex: 1;
        }
        
        .station-info-text h2 { font-size: 0.95rem; font-weight: 700; }
        .station-info-text p { font-size: 0.65rem; opacity: 0.85; }

        .live-progress-container {
            width: 120px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(270deg, var(--accent-color) 0%, #FF4500 100%);
        }

        .live-time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* --- NAVEGACIÓN INFERIOR (FOOTER) --- */
        footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            padding: 12px 0;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
        }

        .nav-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.65rem;
            opacity: 0.6;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .nav-item.active {
            opacity: 1;
            color: var(--accent-color);
            font-weight: 600;
        }
        
        .nav-item i { font-size: 1.1rem; }

        /* Adaptabilidad para móviles */
        @media (max-width: 768px) {
            .side-card { display: none; }
            header { padding: 12px 15px; }
            main { padding: 10px; }
            .radio-dial-container { width: 220px; height: 220px; }
            .current-station-bar { max-width: 92%; }
        }
    </style>
</head>
<body>

    <!-- Elemento de Audio Oculto con tu Stream -->
    <audio id="audioStream" src="https://radio.megahostec.com/listen/radio_la_fan_fm/stream" preload="auto"></audio>

    <!-- CABECERA -->
    <header>
        <div class="header-left">
            <i class="fas fa-bars menu-icon"></i>
            <span class="brand-title">VENEVO MÚSICA</span>
            <!-- Logo oficial respaldado -->
            <img src="https://lafanfm.com/wp-content/uploads/2021/02/LOGO-LA-FAN-FM-1-300x188.png" alt="La Fan FM" class="station-logo-small" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3076/3076778.png'">
        </div>
        <div class="header-right">
            <div class="status-bar" id="statusIndicator">
                <span class="cargando-dot"></span> CONECTANDO
            </div>
            <div class="stats-row">
                <span><i class="fas fa-user fa-xs"></i> 2.773</span>
                <span><i class="far fa-clock fa-xs"></i> <span id="liveTimer">00:00</span></span>
            </div>
            <div class="mode-switch">
                <div class="mode-btn active" onclick="switchMode('radio')">RADIO</div>
                <div class="mode-btn" onclick="switchMode('streaming')">STREAMING</div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO CENTRAL -->
    <main>
        <div class="player-stage">
            <!-- Tarjeta Anterior -->
            <div class="side-card" onclick="changeStation('prev')">
                <h3 id="prevFreq">90.3</h3>
                <p id="prevName">BUSINESSES</p>
                <p id="prevLoc">IMBABURA</p>
            </div>
            
            <!-- Dial Principal con Reproductor -->
            <div class="radio-dial-container">
                <div class="dial-ring"></div>
                <div class="dial-center">
                    <img src="https://lafanfm.com/wp-content/uploads/2021/02/LOGO-LA-FAN-FM-1-300x188.png" alt="La Fan FM" class="station-logo-large" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3076/3076778.png'">
                    <div class="dial-spectrum" id="spectrumVisualizer"></div>
                </div>
                <div class="nav-arrow prev" onclick="changeStation('prev')"><i class="fas fa-chevron-left"></i></div>
                <div class="nav-arrow next" onclick="changeStation('next')"><i class="fas fa-chevron-right"></i></div>
            </div>

            <!-- Tarjeta Siguiente -->
            <div class="side-card" onclick="changeStation('next')">
                <h3 id="nextFreq">80.5</h3>
                <p id="nextName">CLIP</p>
                <p id="nextLoc">HITS</p>
            </div>
        </div>

        <!-- CONTROLES DE REPRODUCCIÓN -->
        <section class="player-controls">
            <i class="fas fa-share-alt control-icon" title="Compartir"></i>
            <i class="far fa-heart control-icon" title="Favoritos"></i>
            
            <div class="play-btn" id="playPauseBtn" onclick="togglePlay()">
                <i class="fas fa-play play-icon" id="playIcon"></i>
            </div>
            
            <i class="fas fa-volume-up control-icon" title="Volumen" onclick="toggleMute()"></i>
            <i class="far fa-comment-dots control-icon" title="Comentarios"></i>
        </section>

        <!-- BARRA DE ESTADO DE EMISORA ACTUAL -->
        <section class="current-station-bar">
            <img src="https://lafanfm.com/wp-content/uploads/2021/02/LOGO-LA-FAN-FM-1-300x188.png" alt="La Fan FM" class="station-logo-tiny" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3076/3076778.png'">
            <div class="station-info-text">
                <h2 id="currentTitle">LA FAN FM</h2>
                <p id="currentDesc">Transmitiendo en vivo</p>
            </div>
            <div class="live-progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
                <div class="live-time-labels">
                    <span>EN VIVO</span>
                    <span>LIVE</span>
                </div>
            </div>
        </section>
    </main>

    <!-- PIE DE PÁGINA (NAVEGACIÓN) -->
    <footer>
        <nav class="nav-bar">
            <div class="nav-item active">
                <i class="fas fa-podcast"></i>
                <span>Radios</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-play-circle"></i>
                <span>Streaming</span>
            </div>
            <div class="nav-item">
                <i class="far fa-heart"></i>
                <span>Favoritos</span>
            </div>
            <div class="nav-item">
                <i class="far fa-newspaper"></i>
                <span>Noticias</span>
            </div>
            <div class="nav-item">
                <i class="fas fa-ellipsis-h"></i>
                <span>Más</span>
            </div>
        </nav>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
        const audio = document.getElementById('audioStream');
        const playIcon = document.getElementById('playIcon');
        const statusIndicator = document.getElementById('statusIndicator');
        const spectrumBars = document.querySelectorAll('.spectrum-bar');
        
        let isPlaying = false;

        // Lista de estaciones simuladas para navegación lateral
        const stations = [
            { freq: '90.3', name: 'BUSINESSES', loc: 'IMBABURA', url: 'https://radio.megahostec.com/listen/radio_la_fan_fm/stream' },
            { freq: 'LA FAN', name: 'LA FAN FM', loc: 'EN VIVO', url: 'https://radio.megahostec.com/listen/radio_la_fan_fm/stream' },
            { freq: '80.5', name: 'CLIP', loc: 'HITS', url: 'https://radio.megahostec.com/listen/radio_la_fan_fm/stream' }
        ];
        let currentIndex = 1;

        // Auto-reproducir al cargar la página (Inicia el stream inmediatamente)
        window.addEventListener('DOMContentLoaded', () => {
            generateSpectrumBars();
            startTimer();

            audio.play().then(() => {
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                statusIndicator.innerHTML = '<span style="color: var(--accent-color);">ONLINE</span>';
                setSpectrumActive(true);
            }).catch(error => {
                console.log("Autoplay bloqueado por políticas del navegador:", error);
                statusIndicator.innerHTML = '<span style="color: #ff9999;">PULSA PLAY</span>';
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                setSpectrumActive(false);
            });
        });

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                statusIndicator.innerHTML = '<span style="color: #ff9999;">PAUSADO</span>';
                setSpectrumActive(false);
            } else {
                audio.play().then(() => {
                    isPlaying = true;
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.add('fa-pause');
                    statusIndicator.innerHTML = '<span style="color: var(--accent-color);">ONLINE</span>';
                    setSpectrumActive(true);
                }).catch(err => {
                    console.error("Error al reproducir:", err);
                });
            }
        }

        function toggleMute() {
            audio.muted = !audio.muted;
        }

        function changeStation(direction) {
            if (direction === 'prev') {
                currentIndex = (currentIndex - 1 + stations.length) % stations.length;
            } else {
                currentIndex = (currentIndex + 1) % stations.length;
            }
            
            const current = stations[currentIndex];
            document.getElementById('currentTitle').innerText = current.name;
            document.getElementById('currentDesc').innerText = current.loc;
            
            audio.src = current.url;
            audio.play().then(() => {
                isPlaying = true;
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                setSpectrumActive(true);
            });
            updateSideCards();
        }

        function updateSideCards() {
            const prevIdx = (currentIndex - 1 + stations.length) % stations.length;
            const nextIdx = (currentIndex + 1) % stations.length;

            document.getElementById('prevFreq').innerText = stations[prevIdx].freq;
            document.getElementById('prevName').innerText = stations[prevIdx].name;
            document.getElementById('prevLoc').innerText = stations[prevIdx].loc;

            document.getElementById('nextFreq').innerText = stations[nextIdx].freq;
            document.getElementById('nextName').innerText = stations[nextIdx].name;
            document.getElementById('nextLoc').innerText = stations[nextIdx].loc;
        }

        function generateSpectrumBars() {
            const container = document.getElementById('spectrumVisualizer');
            container.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const bar = document.createElement('div');
                bar.classList.add('spectrum-bar');
                bar.style.animationDelay = `${Math.random() * 0.5}s`;
                container.appendChild(bar);
            }
        }

        function setSpectrumActive(active) {
            document.querySelectorAll('.spectrum-bar').forEach(bar => {
                bar.style.animationPlayState = active ? 'running' : 'paused';
            });
        }

        function switchMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Cronómetro simple en vivo
        function startTimer() {
            let seconds = 0;
            setInterval(() => {
                seconds++;
                let mins = Math.floor(seconds / 60);
                let secs = seconds % 60;
                document.getElementById('liveTimer').innerText = 
                    (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);
            }, 1000);
        }
    </script>
</body>
</html>
